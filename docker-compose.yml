services:
  db:
    image: mysql:8.0
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASS}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASS}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - awarenix-network

  backend:
    build:
      context: ./be-awarenix
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - awarenix-network

  frontend:
    build:
      context: ./fe-awarenix
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - awarenix-network

networks:
  awarenix-network:

volumes:
  db-data:
